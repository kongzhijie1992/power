[tool.poetry]
name = "power stack(european)"
version = "0.1.0"
description = "European power stack model"
authors = ["ZHIJIE KONG <kylekongcs@users.noreply.github.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^2.3.2"
