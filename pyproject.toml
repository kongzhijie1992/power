matplotlib = "^3.10.6"
scikit-learn = "^1.7.2"
numba = "^0.62.1"
dash = "^3.2.0"
dash-mantine-components = "^2.3.0"
ruff = "^0.14.2"
pandas-stubs = "^2.3.2.250926"
xgboost = "^3.1.1"
pylint = "^4.0.3"
lightgbm = "^4.6.0"
pyyaml = "^6.0.3"
tqdm = "^4.67.1"
pulp = "^3.3.0"
pyarrow = "^22.0.0"
pillow = "^12.0.0"
holidays = "^0.58"
streamlit = "^1.40.1"
pyecharts = "^2.0.8"
streamlit-echarts = "^0.4.0"
s3fs = "^2025.9.0"
python-dotenv = "^1.0.0"
tvdatafeed = {git = "https://github.com/rongardF/tvdatafeed.git"}
