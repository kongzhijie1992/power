# ENTSO-E API token (replace with your token)
entsoe:
  api_key: "17ad76be-f381-48af-88f1-c3e3731d7493"
  # preferred bidding zone
  default_area: DE_LU
  # active areas (GB/IE/NI excluded)
  areas:
    - DE_LU
    - FR
    - IT
    - ES
    - NL
    - BE
    - PT
    - CH
    - AT
    - PL
    - CZ
    - SK
    - HU
    - RO
    - BG
    - SI
    - HR
    - GR
    - DK1
    - DK2
    - FI
    - SE1
    - SE2
    - SE3
    - SE4
    - NO1
    - NO2
    - NO3
    - NO4
    - NO5
    - LT
    - LV
    - EE

# Paths for price/weather files (per area)
paths:
  price_template: "data/{area}/day_ahead_real.parquet"  # fallback to CSV if parquet missing
  weather_template: "data/weather/{area}_weather.csv"

# Data timeframe defaults
data:
  history_days: 90
  forecast_horizon_days: 7
